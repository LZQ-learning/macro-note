name: Validate GitHub Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify static site
        run: |
          test -f docs/index.html
          find docs/assets -name '*.js' -exec node --check {} \;
